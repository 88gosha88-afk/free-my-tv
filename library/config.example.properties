# Free My Library: copy to config.properties (the build does it for you) and fill in.

# The network folder on the router: smb://address/share-name/  (guest access when the login is empty)
smb_url=smb://192.168.1.1/Новый том/
smb_user=
smb_password=

# Folders of the share that hold films and series, separated by commas. Add ":shows" to a folder of series
# and ":movies" to a folder of films; without it the app tells them apart by the names of the files.
folders=!кино,Сериалы:shows,UHD,Загрузки

# Descriptions and posters: your own free key from themoviedb.org (Settings > API). Empty = the key in ../config.properties.
tmdb_key=

# The built-in player (libVLC). abis: the processors to include; armeabi-v7a is the Mi Box and most projectors, arm64-v8a
# the newer boxes. Fewer ABIs make a smaller app (about 30 MB each).
libvlc_version=3.6.0
abis=armeabi-v7a,arm64-v8a
